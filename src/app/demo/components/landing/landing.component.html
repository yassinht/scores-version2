<div class="surface-0 flex justify-content-center w-full">
    <div id="home" class="landing-wrapper overflow-hidden w-full">
        <div class="py-4 px-4 mx-0 md:mx-6 lg:mx-8 lg:px-8 flex align-items-center justify-content-between relative lg:static mb-3 w-full">
            <a class="flex align-items-center" href="#">
                <img src="../../../../assets/demo/images/logo.png" alt="Logo Sakai" height="50" class="mr-0 lg:mr-2"><span class="text-900 font-medium text-2xl line-height-3 mr-8"></span>
            </a>
            <a pRipple class="cursor-pointer block lg:hidden text-700" pStyleClass="@next" enterClass="hidden" leaveToClass="hidden" [hideOnOutsideClick]="true">
                <i class="pi pi-bars text-4xl"></i>
            </a>
            <div class="align-items-center surface-0 flex-grow-1 justify-content-between hidden lg:flex absolute lg:static w-full left-0 px-6 lg:px-0 z-2" style="top:120px">
                <ul class="list-none p-0 m-0 flex lg:align-items-center select-none flex-column lg:flex-row cursor-pointer">
                    <li>
                        <a (click)="router.navigate(['/'], {fragment: 'home'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-medium line-height-3">
                           <span>Accueil</span>
                        </a>
                    </li>
                    <li>
                        <a (click)="router.navigate(['/'], {fragment: 'features'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-medium line-height-3">
                            <span>À propos de nous</span>
                        </a>
                    </li>
                    <li>
                        <a (click)="router.navigate(['/'], {fragment: 'highlights'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-medium line-height-3">
                            <span>Fonctionnalités</span>
                        </a>
                    </li>
                    <li>
                        <a (click)="router.navigate(['/'], {fragment: 'pricing'})" pRipple class="flex m-0 md:ml-5 px-0 py-3 text-900 font-medium line-height-3">
                            <span>Contact</span>
                        </a>
                    </li>
                </ul>
                <div class="flex justify-content-between lg:block border-top-1 lg:border-top-none surface-border py-3 lg:py-0 mt-3 lg:mt-0 mr-5">
                    <button pButton pRipple label="Connexion" routerLink="/auth" class="p-button-rounded border-none ml-5 font-light line-height-2 bg-blue-500 text-white"></button>
                </div>
                
            </div>
        </div>
    
        <div id="hero" class="flex flex-column pt-4 px-4 lg:px-8 overflow-hidden w-full"
            style="background: linear-gradient(0deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)), radial-gradient(77.36% 256.97% at 77.36% 57.52%, #EEEFAF 0%, #C3E3FA 100%); clip-path: ellipse(150% 87% at 93% 13%);">
            <div class="mx-4 md:mx-8 mt-0 md:mt-4 w-full">
                <h1 class="text-6xl font-bold text-gray-900 line-height-2"><span class="font-light block">Bienvenue sur </span>Application de Scores</h1>
                <p class="font-normal text-2xl line-height-3 md:mt-3 text-gray-700">Application de Scores et d'Échelles d'auto-évaluation 
                <p class="font-normal text-2xl line-height-3 md:mt-3 text-gray-700">référencés Scientifiquement pour les professionnels de santé.</p>

                <button pButton pRipple type="button" label="Commencer" class="p-button-rounded text-xl border-none mt-3 bg-blue-500 font-normal line-height-3 px-3 text-white"></button>
            </div>
            <div class="flex justify-content-center md:justify-content-end w-full">
                <img src="assets/demo/images/landing/screen-6.png" alt="Image Hero" class="w-9 md:w-auto">
            </div>
        </div>
        
        <div class="py-4 px-4 mx-0 mt-8 lg:mx-8 w-full">
           
        </div>
    </div>
</div>
