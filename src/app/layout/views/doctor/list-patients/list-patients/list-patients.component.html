<div class="col-12">
  <div class="card">
    <h5>Patients List</h5>
    <p-table   #dt1 
    [value]="patients"
     [paginator]="true"
      [rows]="10" 
      [globalFilterFields]="['name', 'lastname','email']" 
      responsiveLayout="scroll">
      <ng-template pTemplate="caption">
        <div class="flex justify-content-between flex-column sm:flex-row">
          <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash" (click)="clear(dt1)">
          </button>
          <span class="p-input-icon-left mb-2">
            <i class="pi pi-search"></i>
            <input pInputText type="text" #filter (input)="onGlobalFilter(dt1, $event)" placeholder="Search Keyword" class="w-full"/>
          </span>
        </div>
      </ng-template>
      
      <ng-template pTemplate="header">
        <tr>
          <th style="min-width: 12rem">
            <div class="flex justify-content-between align-items-center">
              Name
              <p-columnFilter type="text" field="patients.name" display="menu" placeholder="Search by name"></p-columnFilter>
            </div>
          </th>
          <th style="min-width: 12rem">
            <div class="flex justify-content-between align-items-center">
              Last Name
              <p-columnFilter type="text" field="patients.lastname" display="menu" placeholder="Search by last name"></p-columnFilter>
            </div>
          </th>
          <th style="min-width: 12rem">
            <div class="flex justify-content-between align-items-center">
              Email
              <p-columnFilter type="text" field="patients.email" display="menu" placeholder="Search by email"></p-columnFilter>
            </div>
          </th>
          <th style="min-width: 10rem">
            <div class="flex justify-content-between align-items-center">
              Actions
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-patient>
        <tr>
          <td>{{ patient.name }}</td>
          <td>{{ patient.lastname }}</td>
          <td>{{ patient.email }}</td>
          <td>
 
            <button
            pButton pRipple type="button" 
              [label]="getButtonLabel(patient.invitationState)"
              [ngClass]="getButtonClass(patient.invitationState)"
              [disabled]="patient.invitationState !== 'not_invited'"
              (click)="addPatient(patient._id, patient)"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-toast key="tst"></p-toast>
