<div class="col-12">
  <div class="card">
    <h5>{{ 'MyFolders.foldersList' | translate }}</h5>
    <p-table 
      #dt1 
      [value]="folders" 
      [paginator]="true" 
      [rows]="10" 
      [globalFilterFields]="['name']" 
      responsiveLayout="scroll">
      
      <!-- Caption with Global Filter -->
      <ng-template pTemplate="caption">
        <div class="flex justify-content-between flex-column sm:flex-row">
          <button 
            pButton 
            [label]="'MyFolders.clear' | translate" 
            class="p-button-outlined mb-2" 
            icon="pi pi-filter-slash" 
            (click)="clear(dt1)">
          </button>
          <span class="p-input-icon-left mb-2">
            <i class="pi pi-search"></i>
            <input 
              pInputText 
              type="text" 
              #filter 
              (input)="onGlobalFilter(dt1, $event)" 
              [placeholder]="'MyFolders.searchKeyword' | translate" 
              class="w-full"/>
          </span>
        </div>
      </ng-template>
      
      <!-- Table Header -->
      <ng-template pTemplate="header">
        <tr>
          <th style="min-width: 12rem">
            <div class="flex justify-content-between align-items-center">
              {{ 'MyFolders.name' | translate }}
            </div>
          </th>
          <th style="min-width: 5rem">
            <div class="flex justify-content-between align-items-center">
              {{ 'MyFolders.actions' | translate }}
            </div>
          </th>
        </tr>
      </ng-template>
      
      <!-- Table Body -->
      <ng-template pTemplate="body" let-folder>
        <tr>
          <td>{{ folder.name }}</td>
          <td>
            <button 
              type="button" 
              pButton 
              icon="pi pi-eye"
              [label]="'MyFolders.folderContent' | translate"
              class="p-button-outlined p-button-primary" 
              [routerLink]="['/doctor/folder-preview',folder.name,folder._id]">
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
