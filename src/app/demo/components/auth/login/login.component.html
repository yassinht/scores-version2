<div class="container">
  <div class="form-container">
    <h1>{{ isLoginMode ? 'Connexion' : 'Inscription' }}</h1>

<!-- Formulaire de Connexion -->
<ng-container *ngIf="isLoginMode; else registrationForm">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group-grid">
      <!-- Sélection du rôle pour le formulaire de connexion -->
      <div class="form-group role-selection">
        <label>
          <input
            type="radio"
            value="Doctor"
            name="role"
            (change)="selectedRole = 'Doctor'; updateValidators()"
            [checked]="selectedRole === 'Doctor'"
          />
          Profesionnel
        </label>
        <label>
          <input
            type="radio"
            value="Patient"
            name="role"
            (change)="selectedRole = 'Patient'; updateValidators()"
            [checked]="selectedRole === 'Patient'"
          />
          Patient
        </label>
      </div>
    
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Entrez votre email"
          [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Entrez votre mot de passe"
          [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        />
      </div>
    </div>
    
    <button type="submit" class="btn primary" >
      Connexion
    </button>
  </form>
</ng-container>


    <!-- Formulaire d'Inscription -->
    <ng-template #registrationForm>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Sélection du rôle -->
        <div class="role-selection">
          <label>
            <input
              type="radio"
              value="Doctor"
              name="role"
              (change)="selectedRole = 'Doctor'; updateValidators()"
              [checked]="selectedRole === 'Doctor'"
            />
            Profesionnel
          </label>
          <label>
            <input
              type="radio"
              value="Patient"
              name="role"
              (change)="selectedRole = 'Patient'; updateValidators()"
              [checked]="selectedRole === 'Patient'"
            />
            Patient
          </label>
        </div>

        <!-- Champs Communs -->
        <div class="form-group-grid">
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              formControlName="email"
              placeholder="Entrez votre email"
              [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched"
            />
          </div>
          <div class="form-group">
            <label>Prénom</label>
            <input type="text" formControlName="name" placeholder="Entrez votre prénom" />
          </div>
          <div class="form-group">
            <label>Nom de famille</label>
            <input type="text" formControlName="lastname" placeholder="Entrez votre nom de famille" />
          </div>
          <div class="form-group">
            <label>Date de naissance</label>
            <input type="date" formControlName="birthday" />
          </div>
          <div class="form-group">
            <label>Adresse</label>
            <input type="text" formControlName="adresse" placeholder="Entrez votre adresse" />
          </div>
          <div class="form-group">
            <label>Pays</label>
            <p-dropdown
              [options]="countries"
              placeholder="Sélectionnez un pays"
              optionLabel="name"
              class="multiselect-custom"
              display="chip"
            >
              <ng-template let-country pTemplate="item">
                <div class="flex align-items-center">
                  <img
                    src="assets/demo/images/flag/flag_placeholder.png"
                    [class]="'flag flag-' + country.code.toLowerCase()"
                    style="width:21px"
                  />
                  <span class="ml-2">{{ country.name }}</span>
                </div>
              </ng-template>
            </p-dropdown>
          </div>
          
          <div class="form-group">
            <label>Téléphone</label>
            <input type="tel" formControlName="tel" placeholder="Entrez votre numéro de téléphone" />
          </div>
          <div class="form-group" *ngIf="selectedRole === 'Doctor'">
            <label>Fax</label>
            <input type="fax" formControlName="fax" placeholder="Entrez votre numéro de fax" />
          </div>
          <div class="form-group" *ngIf="selectedRole === 'Doctor'">
            <label>RPPS</label>
            <input type="text" formControlName="rpps" placeholder="Entrez votre RPPS" />
          </div>
          <div class="form-group" *ngIf="selectedRole === 'Doctor'">
            <label>Titre</label>
            <p-dropdown
              id="title"
              formControlName="title"
              [options]="titles"
              placeholder="Sélectionnez un titre"
            ></p-dropdown>
          </div>
          <div class="form-group" *ngIf="selectedRole === 'Doctor'">
            <label>Profession</label>
            <p-dropdown
              id="job"
              [options]="jobs"
              placeholder="Sélectionnez une profession"
              [(ngModel)]="selectedJob"
              optionLabel="viewValue"
              (onChange)="onJobChange($event)"
            >
              <ng-template let-job pTemplate="item">
                <div>{{ job.viewValue }} ({{ job.value }})</div>
              </ng-template>
            </p-dropdown>
          </div>
          <div *ngIf="!isLoginMode && selectedRole === 'Patient'" class="form-group">
            <label for="gender">Genre</label>
            <p-dropdown
              id="gender"
              formControlName="gender"
              [options]="genders"
              optionLabel="label"
              optionValue="value"
              placeholder="Sélectionnez le genre"
              class="form-control"
            ></p-dropdown>
            <div *ngIf="form.get('gender')?.invalid && form.get('gender')?.touched" class="error">
              Le genre est requis.
            </div>
          </div>
          
          <div class="form-group" *ngIf="selectedRole === 'Patient'">
            <label>SSN</label>
            <input type="text" formControlName="ssn" placeholder="Entrez votre SSN" />
          </div>
          <div class="form-group" *ngIf="selectedRole === 'Patient'">
            <label>Poids (kg)</label>
            <input type="number" formControlName="weight" />
          </div>
          <div class="form-group" *ngIf="selectedRole === 'Patient'">
            <label>Taille (cm)</label>
            <input type="number" formControlName="size" />
          </div>
        </div>
        <div class="password-divider">
          <hr class="divider-line" />
          <span class="divider-text">Choisissez votre mot de passe</span>
          <hr class="divider-line" />
        </div>
        <div class="form-group-grid-password" >
          <div class="form-group">
            <label>Mot de passe</label>
            <p-password
              formControlName="password"
              [feedback]="true"
              placeholder="Entrez votre mot de passe"
              [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
            ></p-password>
          </div>
          <div class="form-group">
            <label>Confirmer le mot de passe</label>
            <p-password
              formControlName="confirmPassword"
              placeholder="Confirmez votre mot de passe"
              [class.invalid]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched"
            ></p-password>
          </div>
        </div>
        
        <!-- Consentement et acceptation des conditions -->
        <div class=" align-left">
          <label>
            <input type="checkbox" formControlName="consentement" />
            J'accepte le traitement de mes données personnelles et accepte les <a routerLink="/auth/terms" target="_blank">Conditions générales</a>.
          </label>
        </div>

        <button type="submit" class="btn primary" >
          Inscription
        </button>
      </form>
    </ng-template>

    <!-- Changer de mode -->
    <p class="toggle-text">
      {{ isLoginMode ? 'Pas encore de compte ?' : 'Vous avez déjà un compte ?' }}
      <a href="#" (click)="toggleMode($event)">{{ isLoginMode ? 'Inscription' : 'Connexion' }}</a>
    </p>
  </div>
</div>
