<ul class="layout-menu">
    <ng-container *ngFor="let item of model; let i = index;">
        <li app-menuitem *ngIf="!item.separator" [item]="item" [index]="i" [root]="true"></li>
        <li *ngIf="item.separator" class="menu-separator"></li>
    </ng-container>
    <li>
        <!-- <a href="https://www.primefaces.org/primeblocks-ng/#/">
            <img src="assets/layout/images/{{layoutService.config.colorScheme === 'light' ? 'banner-primeblocks' : 'banner-primeblocks-dark'}}.png" alt="Prime Blocks" class="w-full mt-3"/>
        </a> -->
    </li>
</ul>


<!-- Logout Confirmation Dialog -->
<p-dialog 
  [(visible)]="isLogoutDialogVisible" 
  header="{{ 'menu.confirmLogout' | translate }}" 
  [modal]="true" 
  [style]="{width: '450px'}" 
  [closable]="false">
  <p>{{ 'menu.logoutConfirmation' | translate }}</p>
  <div class="flex justify-content-end gap-2 mt-3">
    <button 
      type="button" 
      pButton 
      label="{{ 'menu.cancel' | translate }}" 
      class="p-button-text" 
      (click)="cancelLogout()"></button>
    <button 
      type="button" 
      pButton 
      label="{{ 'menu.logout' | translate }}" 
      class="p-button-danger" 
      (click)="confirmLogout()"></button>
  </div>
</p-dialog>
