
<!-- Show progress spinner while loading -->
<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-panel header="{{ 'DoctorForms.formManagement' | translate }}" class="mb-4">
        <p-progressSpinner *ngIf="loading" style="display: block; margin: 0 auto; width: 50px; height: 50px;"></p-progressSpinner>

<p-table
  *ngIf="!loading && unfilledForms.length"
  [value]="unfilledForms"
  responsiveLayout="scroll"
  scrollHeight="400px"
  [paginator]="true"
  [rows]="10"
  [globalFilterFields]="['forms.title', 'affectedOn']"
  [rowHover]="true"
  styleClass="p-datatable-gridlines"
>
  <ng-template pTemplate="caption">
    <div class="flex justify-content-between flex-column sm:flex-row">
      <button
        pButton
        [label]="'patientForm.clearFiltersButton' | translate"
        class="p-button-outlined mb-2"
        icon="pi pi-filter-slash"
        (click)="clear(dt1)"
      ></button>
      <span class="p-input-icon-left mb-2">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          #filter
          (input)="onGlobalFilter(dt1, $event)"
          [placeholder]="'patientForm.searchPlaceholder' | translate"
          class="w-full"
        />
      </span>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th style="min-width: 12rem">
        <div class="flex justify-content-between align-items-center">
          {{ 'patientForm.formTitle' | translate }}
          <p-columnFilter
            type="text"
            field="forms.title"
            display="menu"
            [placeholder]="'patientForm.searchByTitlePlaceholder' | translate"
          ></p-columnFilter>
        </div>
      </th>

      <th style="min-width: 14rem">
        <div class="flex justify-content-between align-items-center">
          {{ 'patientForm.affectedOn' | translate }}
          <p-columnFilter
            type="date"
            field="affectedOn"
            display="menu"
            [placeholder]="'patientForm.searchByDatePlaceholder' | translate"
            [showClear]="true"
            [filterMatchMode]="'equals'"
          ></p-columnFilter>
        </div>
      </th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-group>
    <!-- Doctor Group Header -->
    <tr class="doctor-header">
      <td colspan="2" class="doctor-header">
        <img
          [alt]="group.doctor.name"
          [src]="'assets/demo/images/avatar/homme.png'"
          width="32"
          height="32"
          style="vertical-align: middle"
        />
        <span class="font-bold ml-2">
          {{ group.doctor.name }} ({{ group.doctor.job | translate }})
        </span>
      </td>
    </tr>

    <!-- Form Rows -->
    <tr *ngFor="let form of group.forms">
      <td (click)="openFormDetails(form.form._id, group.doctor._id)">
        {{ form.form.title }}
      </td>
      <td>{{ form.affectedOn | date: 'shortDate' }}</td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="2">{{ 'patientForm.noUnfilledFormsMessage' | translate }}</td>
    </tr>
  </ng-template>
</p-table>

      </p-panel></div> </div> </div>
