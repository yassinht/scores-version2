<div class="p-card p-shadow-4 p-mb-4">
    <!-- Header Section -->
    <div class="p-card-header p-d-flex p-jc-between p-ai-center p-pb-3">
        <!-- Patient Name -->
        <div class="p-text-bold p-text-uppercase">
            <h1 style="margin: 0; font-size: 1.8rem; color: #495057;">{{ patientName }}</h1>
        </div>

        <!-- Download PDF Button -->
        <button
            (click)="downloadPDF()"
            pButton
            type="button"
            label="Download PDF"
            icon="pi pi-download"
            class="p-button-primary"
        ></button>
    </div>

    <!-- Body Section -->
    <div class="p-card-body">
        <!-- Loading Spinner -->
        <div class="p-d-flex p-ai-center p-jc-center" *ngIf="loading">
            <i class="pi pi-spin pi-spinner" style="font-size: 2rem; color: #007ad9;"></i>
        </div>

        <!-- Formulaires Section -->
        <div *ngIf="!loading && formulaires.length > 0">
            <p-accordion [multiple]="true">
                <p-accordionTab
                    *ngFor="let formulaire of formulaires"
                    [header]="formulaire.title"
                >
                <div class="tries-grid">
                    <div class="try-card" *ngFor="let try of formulaire.tries">
                        <div class="p-card p-shadow-3">
                            <div class="p-card-body">
                                <p class="try-title">Try #{{ try.tryNumber }}</p>
                                <p class="try-date">Date: {{ try.data_remplissage | date }}</p>
                                <ul class="try-scores">
                                    <li *ngFor="let score of try.scores">
                                        Score: {{ score }}
                                    </li>
                                </ul>
                                <button
                                    (click)="getVersion(formulaire.id, try.tryNumber)"
                                    pButton
                                    type="button"
                                    label="Details"
                                    icon="pi pi-info-circle"
                                    class="p-button-secondary details-button"
                                ></button>
                            </div>
                        </div>
                    </div>
                </div>
                </p-accordionTab>
            </p-accordion>
        </div>

        <!-- No Data Message -->
        <p *ngIf="!loading && formulaires.length === 0" class="p-text-center p-mt-4">
            {{"NODATA.NODATA" | translate}}.
        </p>
    </div>
</div>
